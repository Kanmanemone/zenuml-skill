# 내보내기 스크립트의 npm 의존성을 3개월마다 최신 버전으로 올린다.
# (English: Update the export scripts' npm dependencies to their latest versions every three months.)
version: 2
updates:
  - package-ecosystem: npm
    directory: /.claude/skills/exporting-markdown-diagrams/scripts
    schedule:
      interval: quarterly
    # 나온 지 21일이 지난 버전만 제안한다(악성 릴리스가 발견·회수될 시간을 둔다).
    # (English: Only propose versions released at least 21 days ago, giving time for malicious releases to be caught and pulled.)
    cooldown:
      default-days: 21
    # 모든 업데이트를 PR 하나로 묶는다.
    # (English: Bundle every update into a single pull request.)
    groups:
      all-deps:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
